<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xpediture — Analytics</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">X<span>pediture</span></div>
    <nav>
      <a href="trips.html" class="nav-link"><span class="icon">✈️</span><span>Trips</span></a>
      <a href="expenses.html" class="nav-link"><span class="icon">💸</span><span>Expenses</span></a>
      <a href="analytics.html" class="nav-link active"><span class="icon">📊</span><span>Analytics</span></a>
      <a href="checklist.html" class="nav-link"><span class="icon">🎒</span><span>Checklist</span></a>
      <a href="converter.html" class="nav-link"><span class="icon">💱</span><span>Converter</span></a>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-user" id="sidebarUser"></div>
      <div class="currency-row">
        <label>Home:</label>
        <select id="sidebarCurrency"></select>
      </div>
      <button class="ghost full" style="margin-top:10px;" onclick="toggleTheme()"><span>🌓 Toggle Theme</span></button>
      <button class="ghost full" style="margin-top:10px;" onclick="logout()"><span>Logout</span></button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-content">
    <div class="page-header">
      <h1>Analytics</h1>
      <p>Understand where your money goes</p>
    </div>

    <!-- TRIP SELECT -->
    <div class="card">
      <h3>Viewing Trip</h3>
      <select id="tripSelect" style="max-width:300px;" onchange="changeTrip(this.value)"></select>
    </div>

    <!-- STATS ROW -->
    <div class="grid" id="statsRow" style="margin-bottom:20px;"></div>

    <!-- CHARTS -->
    <div class="grid2">
      <div class="card">
        <h3>By Category</h3>
        <div class="chart-wrap"><canvas id="catChart"></canvas></div>
      </div>
      <div class="card">
        <h3>Daily Spending</h3>
        <div class="chart-wrap"><canvas id="dayChart"></canvas></div>
      </div>
    </div>

    <!-- INSIGHTS -->
    <div class="card">
      <h3>🔍 Insights</h3>
      <div id="insightsList"></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="shared.js"></script>
<script>
let user, data, store;
let catChartInst = null, dayChartInst = null;

Chart.defaults.font.family = "'DM Sans', sans-serif";

async function init() {
  user = requireAuth();
  if (!user) return;
  await loadRates();
  renderSidebarUser(user);
  const res = getUserStore(user);
  data = res.data; store = res.store;
  renderTripSelect();
  renderAnalytics();
}

function renderTripSelect() {
  const sel = document.getElementById("tripSelect");
  const trips = Object.keys(store.trips);
  if (!trips.length) { sel.innerHTML = `<option>No trips yet</option>`; return; }
  sel.innerHTML = trips.map(t => `<option value="${t}" ${t === store.currentTrip ? 'selected' : ''}>${t}</option>`).join('');
}

function changeTrip(name) {
  store.currentTrip = name;
  saveData(data);
  renderAnalytics();
}

function renderAnalytics() {
  const styles = getComputedStyle(document.body);
  Chart.defaults.color = styles.getPropertyValue('--muted').trim();
  Chart.defaults.borderColor = styles.getPropertyValue('--border').trim();

  const tName = store.currentTrip;
  const statsRow = document.getElementById("statsRow");
  const insightsList = document.getElementById("insightsList");

  if (!tName || !store.trips[tName]) {
    statsRow.innerHTML = `<div class="empty"><div class="icon">📊</div><p>Select a trip to see analytics</p></div>`;
    insightsList.innerHTML = '';
    return;
  }

  const trip = store.trips[tName];
  const exps = trip.expenses;
  const total = exps.reduce((a, e) => a + e.amount, 0);
  const avgExp = exps.length ? (total / exps.length).toFixed(2) : '0';
  const dur = trip.start && trip.end ? Math.ceil((new Date(trip.end) - new Date(trip.start)) / 86400000) : 0;
  const dailyAvg = dur > 0 ? (total / dur).toFixed(2) : '—';

  // By category
  const byCat = {};
  exps.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
  const topCat = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a])[0];

  // By day
  const byDay = {};
  exps.forEach(e => { if (e.date) byDay[e.date] = (byDay[e.date] || 0) + e.amount; });

  // Stats row
  statsRow.innerHTML = `
    <div class="stat-box"><div class="val">${trip.currency} ${total.toFixed(2)}</div><div class="lbl">Total Spent</div></div>
    <div class="stat-box"><div class="val">${exps.length}</div><div class="lbl">Expenses</div></div>
    <div class="stat-box"><div class="val">${trip.currency} ${avgExp}</div><div class="lbl">Avg/Expense</div></div>
    <div class="stat-box"><div class="val">${dailyAvg !== '—' ? trip.currency + ' ' + dailyAvg : '—'}</div><div class="lbl">Daily Avg</div></div>
    <div class="stat-box"><div class="val">${topCat || '—'}</div><div class="lbl">Top Category</div></div>`;

  // Category Doughnut
  if (catChartInst) catChartInst.destroy();
  catChartInst = new Chart(document.getElementById("catChart"), {
    type: 'doughnut',
    data: {
      labels: Object.keys(byCat),
      datasets: [{
        data: Object.values(byCat),
        backgroundColor: ['#c8a96e','#7c6fcd','#4ade80','#f87171','#60a5fa','#fbbf24','#a78bfa'],
        borderWidth: 2,
        borderColor: '#16161f'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { padding: 14, font: { size: 12 } } } }
    }
  });

  // Daily Bar Chart
  if (dayChartInst) dayChartInst.destroy();
  const sortedDays = Object.keys(byDay).sort();
  dayChartInst = new Chart(document.getElementById("dayChart"), {
    type: 'bar',
    data: {
      labels: sortedDays.map(d => d.slice(5)),
      datasets: [{
        label: trip.currency,
        data: sortedDays.map(d => byDay[d]),
        backgroundColor: 'rgba(200,169,110,0.7)',
        borderColor: '#c8a96e',
        borderWidth: 1,
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, grid: { color: '#1e1e2e' } },
        x: { grid: { display: false } }
      }
    }
  });

  // Insights
  const insights = [];
  const med = mostExpensiveDay(exps);
  if (med) insights.push({ icon: '🔥', label: 'Most Expensive Day', val: `${med.date} — ${trip.currency} ${med.amount.toFixed(2)}` });
  if (topCat) insights.push({ icon: '📂', label: 'Top Category', val: `${topCat} (${trip.currency} ${byCat[topCat].toFixed(2)})` });

  const streak = spendingStreak(exps);
  if (streak > 1) insights.push({ icon: '📅', label: 'Longest Spending Streak', val: `${streak} consecutive days` });

  if (trip.budget > 0) {
    const rem = trip.budget - total;
    insights.push({ icon: rem >= 0 ? '✅' : '⚠️', label: 'Budget Status', val: `${trip.currency} ${Math.abs(rem).toFixed(2)} ${rem >= 0 ? 'remaining' : 'over budget'}` });
  }

  const homeTotal = convert(total, trip.currency, user.base);
  insights.push({ icon: '💱', label: `In ${user.base}`, val: `${user.base} ${homeTotal.toFixed(2)}` });

  insightsList.innerHTML = !insights.length
    ? `<div class="empty"><p>Add more expenses to see insights.</p></div>`
    : insights.map(ins => `
        <div class="insight-row">
          <span>${ins.icon} <strong>${ins.label}</strong></span>
          <span class="ins-val">${ins.val}</span>
        </div>`).join('');
}

function onCurrencyChange() { renderAnalytics(); }

init();
</script>
</body>
</html>
