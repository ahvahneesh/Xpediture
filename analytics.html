<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xpediture — Analytics</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">X<span>pediture</span></div>
    <nav>
      <a href="trips.html" class="nav-link"><span class="icon">✈️</span><span>Trips</span></a>
      <a href="expenses.html" class="nav-link"><span class="icon">💸</span><span>Expenses</span></a>
      <a href="analytics.html" class="nav-link active"><span class="icon">📊</span><span>Analytics</span></a>
      <a href="checklist.html" class="nav-link"><span class="icon">🎒</span><span>Checklist</span></a>
      <a href="converter.html" class="nav-link"><span class="icon">💱</span><span>Converter</span></a>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-user" id="sidebarUser"></div>
      <div class="currency-row">
        <label>Home:</label>
        <select id="sidebarCurrency"></select>
      </div>
      <button class="ghost full" style="margin-top:10px;" onclick="toggleTheme()"><span>🌓 Toggle Theme</span></button>
      <button class="ghost full" style="margin-top:10px;" onclick="logout()"><span>Logout</span></button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-content">
    <div class="page-header">
      <h1>Analytics</h1>
      <p>Understand where your money goes</p>
    </div>

    <!-- TRIP SELECT -->
    <div class="card">
      <h3>Viewing Trip</h3>
      <select id="tripSelect" style="max-width:300px;" onchange="changeTrip(this.value)"></select>
    </div>

    <!-- STATS ROW -->
    <div class="grid" id="statsRow" style="margin-bottom:20px;"></div>

    <!-- CHARTS -->
    <div class="grid2">
      <div class="card">
        <h3>By Category</h3>
        <div class="chart-wrap"><canvas id="catChart"></canvas></div>
      </div>
      <div class="card">
        <h3>Daily Spending</h3>
        <div class="chart-wrap"><canvas id="dayChart"></canvas></div>
      </div>
    </div>

    <!-- INSIGHTS -->
    <div class="card">
      <h3>🔍 Insights</h3>
      <div id="insightsList"></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="shared.js"></script>
<script>
let user;
let trips = [], expenses = [], currentTrip = null;
let catChartInst = null, dayChartInst = null;

// Ensure Chart.js uses your custom font
Chart.defaults.font.family = "'DM Sans', sans-serif";

async function init() {
  user = requireAuth();
  if (!user) return;
  await loadRates();
  renderSidebarUser(user);
  await refreshData();
}

async function refreshData() {
  // Fetch from the live SQL database
  trips = await getTrips(user.id);
  
  const savedId = localStorage.getItem("xp_current_trip_id");
  currentTrip = trips.find(t => t.id == savedId) || trips[0];
  
  if (currentTrip) {
    localStorage.setItem("xp_current_trip_id", currentTrip.id);
    expenses = await getExpenses(currentTrip.id);
  } else {
    expenses = [];
  }
  
  renderTripSelect();
  renderAnalytics();
}

function renderTripSelect() {
  const sel = document.getElementById("tripSelect");
  if (!trips || !trips.length) { 
    sel.innerHTML = `<option value="">No trips yet</option>`; 
    return; 
  }
  sel.innerHTML = trips.map(t => `<option value="${t.id}" ${currentTrip && t.id === currentTrip.id ? 'selected' : ''}>${t.name}</option>`).join('');
}

async function changeTrip() {
  const sel = document.getElementById("tripSelect");
  const id = sel.value;
  if (!id) return;
  
  localStorage.setItem("xp_current_trip_id", id);
  await refreshData();
}

function renderAnalytics() {
  const root = getComputedStyle(document.documentElement);
  Chart.defaults.color = root.getPropertyValue('--text').trim() || '#606080';
  Chart.defaults.borderColor = root.getPropertyValue('--border').trim() || '#1e1e2e';

  const statsRow = document.getElementById("statsRow");
  const insightsList = document.getElementById("insightsList");

  if (!currentTrip) {
    statsRow.innerHTML = `<div class="empty"><div class="icon">📊</div><p>Select a trip to see analytics</p></div>`;
    insightsList.innerHTML = '';
    if (catChartInst) catChartInst.destroy();
    if (dayChartInst) dayChartInst.destroy();
    return;
  }

  // Calculate totals from SQL data
  const total = expenses.reduce((a, e) => a + parseFloat(e.amount), 0);
  const avgExp = expenses.length ? (total / expenses.length).toFixed(2) : '0';
  
  let dur = 0;
  if (currentTrip.start_date && currentTrip.end_date) {
    dur = Math.ceil((new Date(currentTrip.end_date) - new Date(currentTrip.start_date)) / 86400000);
  }
  const dailyAvg = dur > 0 ? (total / dur).toFixed(2) : '—';
  const curr = currentTrip.currency_code;

  // Aggregate By Category
  const byCat = {};
  expenses.forEach(e => { 
    const catName = e.category || 'Other';
    byCat[catName] = (byCat[catName] || 0) + parseFloat(e.amount); 
  });
  const topCat = Object.keys(byCat).length ? Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a])[0] : null;

  // Aggregate By Day
  const byDay = {};
  expenses.forEach(e => { 
    if (e.date) byDay[e.date] = (byDay[e.date] || 0) + parseFloat(e.amount); 
  });

  // 1. Render Top Stats Row
  statsRow.innerHTML = `
    <div class="stat-box"><div class="val">${curr} ${total.toFixed(2)}</div><div class="lbl">Total Spent</div></div>
    <div class="stat-box"><div class="val">${expenses.length}</div><div class="lbl">Expenses</div></div>
    <div class="stat-box"><div class="val">${curr} ${avgExp}</div><div class="lbl">Avg/Expense</div></div>
    <div class="stat-box"><div class="val">${dailyAvg !== '—' ? curr + ' ' + dailyAvg : '—'}</div><div class="lbl">Daily Avg</div></div>
    <div class="stat-box"><div class="val">${topCat || '—'}</div><div class="lbl">Top Category</div></div>`;

  // 2. Render Category Doughnut Chart
  if (catChartInst) catChartInst.destroy();
  catChartInst = new Chart(document.getElementById("catChart"), {
    type: 'doughnut',
    data: {
      labels: Object.keys(byCat),
      datasets: [{
        data: Object.values(byCat),
        backgroundColor: ['#c8a96e','#7c6fcd','#4ade80','#f87171','#60a5fa','#fbbf24','#a78bfa'],
        borderWidth: 2,
        borderColor: '#16161f' // Matches dark theme background
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { padding: 14, font: { size: 12 } } } }
    }
  });

  // 3. Render Daily Bar Chart
  if (dayChartInst) dayChartInst.destroy();
  const sortedDays = Object.keys(byDay).sort();
  dayChartInst = new Chart(document.getElementById("dayChart"), {
    type: 'bar',
    data: {
      labels: sortedDays.map(d => d.slice(5)), // Show MM-DD
      datasets: [{
        label: curr,
        data: sortedDays.map(d => byDay[d]),
        backgroundColor: 'rgba(200,169,110,0.7)',
        borderColor: '#c8a96e',
        borderWidth: 1,
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, grid: { color: '#1e1e2e' } },
        x: { grid: { display: false } }
      }
    }
  });

  // 4. Calculate Smart Insights
  const insights = [];
  const med = mostExpensiveDay(expenses);
  if (med) insights.push({ icon: '🔥', label: 'Most Expensive Day', val: `${med.date} — ${curr} ${med.amount.toFixed(2)}` });
  if (topCat) insights.push({ icon: '📂', label: 'Top Category', val: `${topCat} (${curr} ${byCat[topCat].toFixed(2)})` });

  const streak = spendingStreak(expenses);
  if (streak > 1) insights.push({ icon: '📅', label: 'Longest Spending Streak', val: `${streak} consecutive days` });

  if (currentTrip.budget > 0) {
    const rem = currentTrip.budget - total;
    insights.push({ icon: rem >= 0 ? '✅' : '⚠️', label: 'Budget Status', val: `${curr} ${Math.abs(rem).toFixed(2)} ${rem >= 0 ? 'remaining' : 'over budget'}` });
  }

  const homeCur = user.home_currency || 'USD';
  const homeTotal = convert(total, curr, homeCur);
  insights.push({ icon: '💱', label: `In ${homeCur}`, val: `${homeCur} ${homeTotal.toFixed(2)}` });

  insightsList.innerHTML = !insights.length
    ? `<div class="empty"><p>Add more expenses to see insights.</p></div>`
    : insights.map(ins => `
        <div class="insight-row">
          <span>${ins.icon} <strong>${ins.label}</strong></span>
          <span class="ins-val">${ins.val}</span>
        </div>`).join('');
}

// Ensure the dropdown triggers changeTrip correctly
const tripSelectEl = document.getElementById("tripSelect");
if (tripSelectEl) {
  tripSelectEl.addEventListener("change", changeTrip);
}

// Re-render when theme or currency changes
function onCurrencyChange() { renderAnalytics(); }
document.addEventListener('themeChanged', renderAnalytics);

init();
</script>
</body>
</html>
