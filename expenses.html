<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xpediture — Expenses</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">X<span>pediture</span></div>
    <nav>
      <a href="trips.html" class="nav-link"><span class="icon">✈️</span><span>Trips</span></a>
      <a href="expenses.html" class="nav-link active"><span class="icon">💸</span><span>Expenses</span></a>
      <a href="analytics.html" class="nav-link"><span class="icon">📊</span><span>Analytics</span></a>
      <a href="checklist.html" class="nav-link"><span class="icon">🎒</span><span>Checklist</span></a>
      <a href="converter.html" class="nav-link"><span class="icon">💱</span><span>Converter</span></a>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-user" id="sidebarUser"></div>
      <div class="currency-row">
        <label>Home:</label>
        <select id="sidebarCurrency"></select>
      </div>
      <button class="ghost full" style="margin-top:10px;" onclick="toggleTheme()"><span>🌓 Toggle Theme</span></button>
      <button class="ghost full" style="margin-top:10px;" onclick="logout()"><span>Logout</span></button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-content">
    <div class="page-header">
      <h1>Expenses</h1>
      <p id="subTitle">Select a trip to manage expenses</p>
    </div>

    <!-- TRIP SELECTOR -->
    <div class="card" style="margin-bottom:20px;">
      <h3>Active Trip</h3>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <select id="tripSelect" style="max-width:280px;" onchange="changeTrip(this.value)"></select>
        <a href="trips.html" style="font-size:13px;color:var(--accent);text-decoration:none;">+ Create new trip</a>
      </div>
    </div>

    <!-- TRIP SUMMARY -->
    <div id="summaryCard" class="card"></div>

    <!-- ADD EXPENSE -->
    <div class="card">
      <h3>➕ Add Expense</h3>
      <div class="grid">
        <div class="field">
          <label>Title</label>
          <input id="expTitle" placeholder="What did you spend on?">
        </div>
        <div class="field">
          <label>Amount</label>
          <input id="expAmount" type="number" placeholder="0.00">
        </div>
        <div class="field">
          <label>Category</label>
          <select id="expCat" onchange="document.getElementById('expCatCustom').style.display = this.value === 'custom' ? 'block' : 'none'">
            <option>🍔 Food</option>
            <option>🚌 Transport</option>
            <option>🏨 Stay</option>
            <option>🛍 Shopping</option>
            <option>🎭 Entertainment</option>
            <option>💊 Health</option>
            <option>📦 Other</option>
            <option value="custom">✨ Custom...</option>
          </select>
          <input id="expCatCustom" placeholder="Enter category..." style="display:none; margin-top:8px;">
        </div>
        <div class="field">
          <label>Date</label>
          <input id="expDate" type="date">
        </div>
      </div>
      <button onclick="addExpense()" style="margin-top:6px;">Add Expense</button>
    </div>

    <!-- EXPENSE LIST -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
        <h3 style="margin:0;">💸 All Expenses</h3>
        <div style="display:flex;gap:8px;">
          <button class="ghost sm" onclick="exportCSV()">⬇ CSV</button>
          <button class="ghost sm" onclick="exportPDF()">⬇ PDF</button>
        </div>
      </div>
      <input id="search" placeholder="Search expenses..." oninput="renderList()" style="margin-bottom:16px;">
      <div class="scroll"><ul id="expList" style="list-style:none;padding:0;margin:0;"></ul></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="shared.js"></script>
<script>
let user;
let trips = [], expenses = [], currentTrip = null;

async function init() {
  user = requireAuth();
  if (!user) return;
  await loadRates();
  renderSidebarUser(user);
  
  const dateInput = document.getElementById("expDate");
  if (dateInput) dateInput.valueAsDate = new Date();
  
  await refreshData();
}

async function refreshData() {
  // 1. Fetch all trips for this user
  trips = await getTrips(user.id);
  
  // 2. Figure out which trip we are looking at
  const savedId = localStorage.getItem("xp_current_trip_id");
  currentTrip = trips.find(t => t.id == savedId) || trips[0];
  
  // 3. Fetch the specific expenses for this trip
  if (currentTrip) {
    localStorage.setItem("xp_current_trip_id", currentTrip.id);
    expenses = await getExpenses(currentTrip.id);
  } else {
    expenses = [];
  }
  
  renderTripSelect();
  renderSummary();
  renderList();
}

function renderTripSelect() {
  const sel = document.getElementById("tripSelect");
  if (!trips || !trips.length) {
    sel.innerHTML = `<option value="">No trips — create one first</option>`;
    return;
  }
  sel.innerHTML = trips.map(t => `<option value="${t.id}" ${currentTrip && t.id === currentTrip.id ? 'selected' : ''}>${t.name}</option>`).join('');
}

async function changeTrip() {
  const sel = document.getElementById("tripSelect");
  const id = sel.value;
  if (!id) return;
  
  localStorage.setItem("xp_current_trip_id", id);
  await refreshData();
}

function renderSummary() {
  const card = document.getElementById("summaryCard");
  document.getElementById("subTitle").textContent = currentTrip ? `Trip: ${currentTrip.name}` : "Select a trip below";
  
  if (!currentTrip) {
    card.innerHTML = `<div class="empty"><div class="icon">✈️</div><p>No trip selected. <a href="trips.html" style="color:var(--accent)">Go to Trips</a> to create one.</p></div>`;
    return;
  }
  
  // Calculate stats from the live SQL data
  const total = expenses.reduce((a, e) => a + parseFloat(e.amount), 0);
  let dur = 0;
  if (currentTrip.start_date && currentTrip.end_date) {
    dur = Math.ceil((new Date(currentTrip.end_date) - new Date(currentTrip.start_date)) / 86400000);
  }
  
  const dailyAvg = dur > 0 ? (total / dur).toFixed(2) : '—';
  const homeAmt = convert(total, currentTrip.currency_code, user.home_currency || user.base || 'USD');
  const med = mostExpensiveDay(expenses);
  const streak = spendingStreak(expenses);

  card.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
      <div>
        <div style="font-size:18px;font-weight:700;">${currentTrip.name}</div>
        <span class="badge ${currentTrip.status}">${statusLabel(currentTrip.status)}</span>
      </div>
      <div style="text-align:right;">
        <div style="font-family:'DM Mono',monospace;font-size:26px;font-weight:600;color:var(--accent);">${currentTrip.currency_code} ${total.toFixed(2)}</div>
        <div style="font-size:13px;color:var(--muted);">≈ ${user.home_currency || 'USD'} ${homeAmt.toFixed(2)}</div>
      </div>
    </div>
    <div class="grid3" style="margin-bottom:${currentTrip.budget ? '14px' : '0'}">
      <div class="stat-box"><div class="val">${expenses.length}</div><div class="lbl">Expenses</div></div>
      <div class="stat-box"><div class="val">${dur || '—'}</div><div class="lbl">Days</div></div>
      <div class="stat-box"><div class="val">${dailyAvg !== '—' ? currentTrip.currency_code + ' ' + dailyAvg : '—'}</div><div class="lbl">Daily Avg</div></div>
      <div class="stat-box"><div class="val">${med ? currentTrip.currency_code + ' ' + med.amount.toFixed(2) : '—'}</div><div class="lbl">Biggest Day</div></div>
      <div class="stat-box"><div class="val">${med ? med.date : '—'}</div><div class="lbl">On</div></div>
      <div class="stat-box"><div class="val">${streak} day${streak !== 1 ? 's' : ''}</div><div class="lbl">Streak</div></div>
    </div>
    ${budgetBarHtml(currentTrip.currency_code, total, currentTrip.budget)}`;
}

async function addExpense() {
  if (!currentTrip) return notify("Select a trip first", "error");
  const titleInput = document.getElementById("expTitle").value.trim();
  const amount = parseFloat(document.getElementById("expAmount").value);
  let cat = document.getElementById("expCat").value;
  
  if (cat === 'custom') {
    cat = document.getElementById("expCatCustom").value.trim() || "📦 Other";
  }
  const date = document.getElementById("expDate").value;
  if (!titleInput || !amount || !date) return notify("Fill all fields", "error");

  const res = await apiFetch(`/api/expenses/${currentTrip.id}`, {
    method: 'POST',
    body: JSON.stringify({ 
      title: titleInput, 
      amount: amount, 
      date: date,
      category_name: cat // THE FIX: Actually sending the category to Flask!
    })
  });

  if (res && res.ok) {
    document.getElementById("expTitle").value = "";
    document.getElementById("expAmount").value = "";
    await refreshData();
    notify("Expense added!");
  } else {
    notify("Failed to add expense.", "error");
  }
}

async function deleteExpense(expenseId) {
  if (!confirm("Remove this expense?")) return;
  const res = await apiFetch(`/api/expenses/delete/${expenseId}`, { method: 'DELETE' });
  if (res && res.ok) {
    await refreshData();
    notify("Expense removed");
  } else {
    notify("Failed to delete expense. (Check app.py route!)", "error");
  }
}

function renderList() {
  const ul = document.getElementById("expList");
  if (!currentTrip) { ul.innerHTML = ''; return; }
  
  const q = document.getElementById("search").value.toLowerCase();
  const filtered = expenses.filter(e => e.title.toLowerCase().includes(q) || (e.category && e.category.toLowerCase().includes(q)));
  
  if (!filtered.length) {
    ul.innerHTML = `<div class="empty"><div class="icon">💸</div><p>No expenses found.</p></div>`;
    return;
  }
  
  ul.innerHTML = filtered.map(e => `
    <li class="expense-item">
      <div>
        <div class="title">${e.title}</div>
        <div class="meta">${e.date}</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <span class="amount">${currentTrip.currency_code} ${parseFloat(e.amount).toFixed(2)}</span>
        <button class="danger sm" onclick="deleteExpense(${e.id})">✕</button>
      </div>
    </li>`).join('');
}

// Ensure the dropdown triggers changeTrip correctly
document.getElementById("tripSelect").addEventListener("change", changeTrip);

// ── EXPORT CSV ─────────────────────────────────────────────
function exportCSV() {
  if (!currentTrip) return notify("No trip selected", "error");
  const total = expenses.reduce((a, e) => a + parseFloat(e.amount), 0);
  const rows = [['Title','Amount',`Currency (${currentTrip.currency_code})`,'Date'],
    ...expenses.map(e => [e.title, e.amount, currentTrip.currency_code, e.date]),
    [], ['TOTAL', total.toFixed(2), currentTrip.currency_code, '']];
  
  if (currentTrip.budget) rows.push(['BUDGET', currentTrip.budget, currentTrip.currency_code, '']);
  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `${currentTrip.name.replace(/\s+/g,'_')}_expenses.csv`;
  a.click();
  notify("CSV exported!");
}

// ── EXPORT PDF ─────────────────────────────────────────────
function exportPDF() {
  if (!currentTrip) return notify("No trip selected", "error");
  const total = expenses.reduce((a, e) => a + parseFloat(e.amount), 0);
  let dur = 0;
  if (currentTrip.start_date && currentTrip.end_date) {
    dur = Math.ceil((new Date(currentTrip.end_date) - new Date(currentTrip.start_date)) / 86400000);
  }
  const homeAmt = convert(total, currentTrip.currency_code, user.home_currency || 'USD');

  const rows = expenses.map(e => `<tr><td>${e.title}</td><td>${e.date}</td><td style="text-align:right;font-weight:600;">${currentTrip.currency_code} ${parseFloat(e.amount).toFixed(2)}</td></tr>`).join('');

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>
    body{font-family:-apple-system,Arial;margin:40px;color:#1a1a1a;}
    h1{font-size:26px;margin-bottom:4px;letter-spacing:-0.5px;}
    .sub{color:#666;font-size:14px;margin-bottom:24px;}
    .stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px;}
    .stat{background:#f5f5f7;border-radius:10px;padding:12px 18px;}
    .stat .v{font-size:18px;font-weight:700;color:#0071e3;}
    .stat .l{font-size:11px;color:#666;text-transform:uppercase;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{background:#f5f5f7;padding:10px;text-align:left;border-bottom:2px solid #ddd;}
    td{padding:10px;border-bottom:1px solid #eee;}
    .total td{font-weight:700;background:#f5f5f7;}
    @media print{button{display:none;}}
  </style></head><body>
  <h1>✈️ ${currentTrip.name}</h1>
  <div class="sub">${statusLabel(currentTrip.status)}${currentTrip.start_date?` · ${currentTrip.start_date} → ${currentTrip.end_date}`:''}${dur?` · ${dur} days`:''}</div>
  <div class="stats">
    <div class="stat"><div class="v">${currentTrip.currency_code} ${total.toFixed(2)}</div><div class="l">Total Spent</div></div>
    <div class="stat"><div class="v">≈ ${user.home_currency || 'USD'} ${homeAmt.toFixed(2)}</div><div class="l">Home Currency</div></div>
    <div class="stat"><div class="v">${expenses.length}</div><div class="l">Expenses</div></div>
    ${dur?`<div class="stat"><div class="v">${currentTrip.currency_code} ${(total/dur).toFixed(2)}</div><div class="l">Daily Avg</div></div>`:''}
    ${currentTrip.budget?`<div class="stat"><div class="v">${currentTrip.currency_code} ${currentTrip.budget}</div><div class="l">Budget</div></div>`:''}
  </div>
  <table>
    <thead><tr><th>Title</th><th>Date</th><th style="text-align:right;">Amount</th></tr></thead>
    <tbody>${rows}<tr class="total"><td colspan="2">TOTAL</td><td style="text-align:right;">${currentTrip.currency_code} ${total.toFixed(2)}</td></tr></tbody>
  </table>
  <p style="margin-top:28px;font-size:12px;color:#999;">Generated by Xpediture · ${new Date().toLocaleDateString()}</p>
  <script>window.onload=()=>window.print();<\/script>
  </body></html>`;

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  notify("PDF ready!");
}

function onCurrencyChange() { renderSummary(); }

init();
</script>
</body>
</html>
