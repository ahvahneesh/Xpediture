<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xpediture — Checklist</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">X<span>pediture</span></div>
    <nav>
      <a href="trips.html" class="nav-link"><span class="icon">✈️</span><span>Trips</span></a>
      <a href="expenses.html" class="nav-link"><span class="icon">💸</span><span>Expenses</span></a>
      <a href="analytics.html" class="nav-link"><span class="icon">📊</span><span>Analytics</span></a>
      <a href="checklist.html" class="nav-link active"><span class="icon">🎒</span><span>Checklist</span></a>
      <a href="converter.html" class="nav-link"><span class="icon">💱</span><span>Converter</span></a>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-user" id="sidebarUser"></div>
      <div class="currency-row">
        <label>Home:</label>
        <select id="sidebarCurrency"></select>
      </div>
      <button class="ghost full" style="margin-top:10px;" onclick="toggleTheme()"><span>🌓 Toggle Theme</span></button>
      <button class="ghost full" style="margin-top:10px;" onclick="logout()"><span>Logout</span></button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-content">
    <div class="page-header">
      <h1>Packing Checklist</h1>
      <p>Make sure you don't leave anything behind</p>
    </div>

    <!-- TRIP SELECT -->
    <div class="card">
      <h3>Active Trip</h3>
      <select id="tripSelect" style="max-width:300px;" onchange="changeTrip(this.value)"></select>
    </div>

    <!-- PROGRESS -->
    <div class="card" id="progressCard" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="margin:0;">Packing Progress</h3>
        <span id="progressLabel" style="font-family:'DM Mono',monospace;font-size:14px;color:var(--accent);"></span>
      </div>
      <div class="progress-wrap" style="height:10px;">
        <div id="progressBar" class="progress-bar" style="background:var(--success);width:0%;"></div>
      </div>
    </div>

    <!-- ADD ITEM -->
    <div class="card">
      <h3>➕ Add Item</h3>

      <!-- QUICK TEMPLATES -->
      <div style="margin-bottom:14px;">
        <label style="margin-bottom:8px;">Quick Add Templates</label>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          <button class="ghost sm" onclick="addTemplate('essentials')">🗂 Essentials</button>
          <button class="ghost sm" onclick="addTemplate('clothes')">👕 Clothes</button>
          <button class="ghost sm" onclick="addTemplate('tech')">💻 Tech</button>
          <button class="ghost sm" onclick="addTemplate('beach')">🏖 Beach</button>
          <button class="ghost sm" onclick="addTemplate('health')">💊 Health</button>
        </div>
      </div>

      <div style="display:flex;gap:10px;">
        <input id="checkInput" placeholder="Add a packing item..." onkeydown="if(event.key==='Enter')addItem()" style="flex:1;">
        <button onclick="addItem()">Add</button>
      </div>
    </div>

    <!-- CHECKLIST -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 style="margin:0;">🎒 Items</h3>
        <div style="display:flex;gap:8px;">
          <button class="ghost sm" onclick="clearDone()" id="clearDoneBtn" style="display:none;">Clear Done</button>
          <button class="danger sm" onclick="clearAll()" id="clearAllBtn" style="display:none;">Clear All</button>
        </div>
      </div>

      <!-- FILTER TABS -->
      <div style="display:flex;gap:6px;margin-bottom:16px;">
        <button class="ghost sm active-filter" id="filterAll" onclick="setFilter('all')">All</button>
        <button class="ghost sm" id="filterTodo" onclick="setFilter('todo')">To Pack</button>
        <button class="ghost sm" id="filterDone" onclick="setFilter('done')">Packed ✓</button>
      </div>

      <div id="checkList"></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="shared.js"></script>
<script>
let user;
let currentFilter = 'all';

const TEMPLATES = {
  essentials: ['Passport', 'Wallet', 'Phone', 'Phone charger', 'Headphones', 'Travel adapter', 'Cash', 'Travel insurance docs'],
  clothes: ['T-shirts', 'Pants/Jeans', 'Underwear', 'Socks', 'Jacket', 'Sleepwear', 'Swimsuit', 'Comfortable shoes', 'Formal outfit'],
  tech: ['Laptop', 'Laptop charger', 'Camera', 'Camera charger', 'Memory cards', 'Power bank', 'USB cables', 'Earbuds'],
  beach: ['Sunscreen SPF 50+', 'Sunglasses', 'Flip flops', 'Beach towel', 'Swimsuit', 'Snorkel gear', 'Hat/Cap', 'Aloe vera gel'],
  health: ['Prescription meds', 'Pain relievers', 'Band-aids', 'Hand sanitizer', 'Face masks', 'Vitamins', 'Antidiarrheal', 'Motion sickness pills']
};

let trips = [], items = [], currentTrip = null;

async function init() {
  user = requireAuth();
  if (!user) return;
  await loadRates();
  renderSidebarUser(user);
  await refreshData();
}

async function refreshData() {
  trips = await getTrips(user.id);
  const savedId = localStorage.getItem("xp_current_trip_id");
  currentTrip = trips.find(t => t.id == savedId) || trips[0];
  
  if (currentTrip) {
    localStorage.setItem("xp_current_trip_id", currentTrip.id);
    items = await getChecklist(currentTrip.id);
  } else {
    items = [];
  }
  
  renderTripSelect();
  renderChecklist();
}

function renderTripSelect() {
  const sel = document.getElementById("tripSelect");
  if (!trips || !trips.length) { 
    sel.innerHTML = `<option value="">No trips — create one first</option>`; 
    return; 
  }
  sel.innerHTML = trips.map(t => `<option value="${t.id}" ${currentTrip && t.id === currentTrip.id ? 'selected' : ''}>${t.name}</option>`).join('');
}

async function changeTrip() {
  const sel = document.getElementById("tripSelect");
  const id = sel.value;
  if (!id) return;
  localStorage.setItem("xp_current_trip_id", id);
  await refreshData();
}

async function addItem() {
  if (!currentTrip) return notify("Select a trip first", "error");
  const val = document.getElementById("checkInput").value.trim();
  if (!val) return;
  
  // Prevent duplicates locally before hitting SQL
  if (items.find(x => x.item_text.toLowerCase() === val.toLowerCase())) return notify("Item already exists", "warn");
  
  const res = await apiFetch(`/api/checklist/${currentTrip.id}`, {
    method: 'POST',
    body: JSON.stringify({ item_text: val, is_done: false })
  });

  if (res && res.ok) {
    document.getElementById("checkInput").value = "";
    await refreshData();
  } else {
    notify("Failed to add item.", "error");
  }
}

async function addTemplate(type) {
  if (!currentTrip) return notify("Select a trip first", "error");
  
  const existing = items.map(x => x.item_text.toLowerCase());
  let added = 0;

  const emojis = { essentials: '🗂', clothes: '👕', tech: '💻', beach: '🏖', health: '💊' };
  const emojiPrefix = `<span style="font-size: 1.2em; font-weight: bold; margin-right: 6px;">${emojis[type]}</span>`;

  // Bulk SQL insert handling via promises
  const promises = [];
  
  TEMPLATES[type].forEach(itemText => {
    const taggedItem = emojiPrefix + itemText;
    if (!existing.includes(taggedItem.toLowerCase())) {
      const p = apiFetch(`/api/checklist/${currentTrip.id}`, {
        method: 'POST',
        body: JSON.stringify({ item_text: taggedItem, is_done: false })
      });
      promises.push(p);
      added++;
    }
  });

  if (added > 0) {
    await Promise.all(promises);
    await refreshData();
    notify(`Added ${added} items!`);
  } else {
    notify("Template items already packed!", "warn");
  }
}

async function toggleItem(id, currentStatus) {
  const res = await apiFetch(`/api/checklist/item/${id}`, {
    method: 'PUT',
    body: JSON.stringify({ is_done: !currentStatus })
  });
  if (res && res.ok) await refreshData();
}

async function deleteItem(id) {
  const res = await apiFetch(`/api/checklist/item/${id}`, { method: 'DELETE' });
  if (res && res.ok) await refreshData();
}

async function clearDone() {
  const doneItems = items.filter(x => x.is_done);
  if (!doneItems.length) return;
  
  const promises = doneItems.map(item => apiFetch(`/api/checklist/item/${item.id}`, { method: 'DELETE' }));
  await Promise.all(promises);
  
  await refreshData();
  notify("Cleared packed items");
}

async function clearAll() {
  if (!confirm("Clear the entire checklist?")) return;
  
  const promises = items.map(item => apiFetch(`/api/checklist/item/${item.id}`, { method: 'DELETE' }));
  await Promise.all(promises);
  
  await refreshData();
  notify("List cleared");
}

function setFilter(f) {
  currentFilter = f;
  ['All','Todo','Done'].forEach(n => {
    const btn = document.getElementById('filter'+n);
    if (btn) {
      btn.style.background = f === n.toLowerCase() ? 'var(--accent)' : '';
      btn.style.color = f === n.toLowerCase() ? '#0a0a0f' : '';
    }
  });
  renderChecklist();
}

function renderChecklist() {
  const container = document.getElementById("checkList");
  const progressCard = document.getElementById("progressCard");

  if (!currentTrip) {
    container.innerHTML = `<div class="empty"><div class="icon">🎒</div><p>Select a trip to manage your checklist</p></div>`;
    if (progressCard) progressCard.style.display = 'none';
    return;
  }

  const done = items.filter(x => x.is_done).length;
  const pct = items.length ? Math.round((done / items.length) * 100) : 0;

  if (progressCard) {
    progressCard.style.display = items.length ? 'block' : 'none';
    document.getElementById("progressLabel").textContent = `${done} / ${items.length} packed (${pct}%)`;
    document.getElementById("progressBar").style.width = pct + '%';
  }

  const clearDoneBtn = document.getElementById("clearDoneBtn");
  const clearAllBtn = document.getElementById("clearAllBtn");
  if (clearDoneBtn) clearDoneBtn.style.display = done > 0 ? 'block' : 'none';
  if (clearAllBtn) clearAllBtn.style.display = items.length > 0 ? 'block' : 'none';

  const filtered = items.filter(item => {
    if (currentFilter === 'todo') return !item.is_done;
    if (currentFilter === 'done') return item.is_done;
    return true;
  });

  if (!filtered.length) {
    container.innerHTML = `<div class="empty"><p>${currentFilter === 'done' ? 'Nothing packed yet.' : currentFilter === 'todo' ? 'All done! ✓' : 'No items yet. Add something above!'}</p></div>`;
    return;
  }

  container.innerHTML = filtered.map(item => `
    <div class="check-row">
      <input type="checkbox" ${item.is_done ? 'checked' : ''} onchange="toggleItem(${item.id}, ${item.is_done})">
      <span style="flex:1;" class="${item.is_done ? 'done' : ''}">${item.item_text}</span>
      <button class="danger sm" onclick="deleteItem(${item.id})">✕</button>
    </div>`).join('');
}

const tripSelectEl = document.getElementById("tripSelect");
if (tripSelectEl) tripSelectEl.addEventListener("change", changeTrip);

init();
</script>
</body>
</html>
