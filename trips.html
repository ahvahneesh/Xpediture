<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xpediture — Trips</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">X<span>pediture</span></div>
    <nav>
      <a href="trips.html" class="nav-link active"><span class="icon">✈️</span><span>Trips</span></a>
      <a href="expenses.html" class="nav-link"><span class="icon">💸</span><span>Expenses</span></a>
      <a href="analytics.html" class="nav-link"><span class="icon">📊</span><span>Analytics</span></a>
      <a href="checklist.html" class="nav-link"><span class="icon">🎒</span><span>Checklist</span></a>
      <a href="converter.html" class="nav-link"><span class="icon">💱</span><span>Converter</span></a>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-user" id="sidebarUser"></div>
      <div class="currency-row">
        <label>Home:</label>
        <select id="sidebarCurrency"></select>
      </div>
      <button class="ghost full" style="margin-top:10px;" onclick="toggleTheme()"><span>🌓 Toggle Theme</span></button>
      <button class="ghost full" style="margin-top:10px;" onclick="logout()"><span>Logout</span></button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-content">
    <div class="page-header">
      <h1>Your Trips</h1>
      <p>Create and manage all your travel adventures</p>
    </div>

    <!-- CREATE TRIP -->
    <div class="card">
      <h3>➕ New Trip</h3>
      <div class="grid">
        <div class="field">
          <label>Trip Name</label>
          <input id="tripName" placeholder="e.g. Paris 2025">
        </div>
        <div class="field">
          <label>Currency</label>
          <select id="tripCurrency"></select>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="tripStatus">
            <option value="planned">📅 Planned</option>
            <option value="ongoing">🟢 Ongoing</option>
            <option value="completed">✅ Completed</option>
          </select>
        </div>
        <div class="field">
          <label>Start Date</label>
          <input id="tripStart" type="date">
        </div>
        <div class="field">
          <label>End Date</label>
          <input id="tripEnd" type="date">
        </div>
        <div class="field">
          <label>Budget (optional)</label>
          <input id="tripBudget" type="number" placeholder="0">
        </div>
      </div>
      <div class="field" style="margin-top:4px;">
        <label>Cover Photo URL (optional)</label>
        <input id="tripCover" placeholder="https://images.unsplash.com/...">
      </div>
      <button onclick="addTrip()" style="margin-top:6px;">Create Trip</button>
    </div>

    <!-- TRIP LIST -->
    <div class="card">
      <h3>🗺️ All Trips</h3>
      <div id="tripList" class="grid2"></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="shared.js"></script>
<script>
let user;
let trips = [];

async function init() {
  user = requireAuth();
  if (!user) return;
  await loadRates();
  renderSidebarUser(user);
  
  // Set default currency to the user's saved preference
  populateCurrencySelect(document.getElementById("tripCurrency"), user.home_currency || "USD");
  await refreshData();
}

async function refreshData() {
  // Fetch from Flask using the real database user.id
  trips = await getTrips(user.id);
  renderTrips();
}

async function addTrip() {
  const name = document.getElementById("tripName").value.trim();
  if (!name) return notify("Enter a trip name", "error");
  
  // Create payload matching your schema.sql exactly
  const payload = {
    user_id: user.id, // Crucial: ties the trip to the logged-in user
    name: name,
    currency_code: document.getElementById("tripCurrency").value,
    status: document.getElementById("tripStatus").value,
    start_date: document.getElementById("tripStart").value,
    end_date: document.getElementById("tripEnd").value,
    budget: parseFloat(document.getElementById("tripBudget").value) || 0,
    cover_url: document.getElementById("tripCover").value.trim()
  };

  const res = await apiFetch(`/api/trips?user_id=${user.id}`, {
    method: 'POST',
    body: JSON.stringify(payload)
  });

  if (res && res.ok) {
    document.getElementById("tripName").value = "";
    document.getElementById("tripBudget").value = "";
    document.getElementById("tripCover").value = "";
    await refreshData();
    notify(`Trip "${name}" created!`);
  } else {
    notify("Failed to create trip. Check server logs.", "error");
  }
}

function selectTrip(id) {
  // Save the SQL Primary Key (id) to load the correct expenses later
  localStorage.setItem("xp_current_trip_id", id);
  window.location.href = "expenses.html";
}

async function deleteTrip(id, name) {
  if (!confirm(`Delete trip "${name}" and all its data?`)) return;
  
  // Send DELETE command to Flask (DML Implementation!)
  const res = await apiFetch(`/api/trips/${id}`, { method: 'DELETE' });
  
  if (res && res.ok) {
    if (localStorage.getItem("xp_current_trip_id") == id) {
      localStorage.removeItem("xp_current_trip_id");
    }
    await refreshData();
    notify("Trip deleted");
  } else {
    notify("Error deleting trip.", "error");
  }
}

function renderTrips() {
  const container = document.getElementById("tripList");
  
  if (!trips || !trips.length) {
    container.innerHTML = `<div class="empty"><div class="icon">✈️</div><p>No trips yet. Create your first trip above!</p></div>`;
    return;
  }

  const currentTripId = parseInt(localStorage.getItem("xp_current_trip_id"));

  container.innerHTML = trips.map(trip => {
    const expenseList = trip.expenses || [];
    const total = expenseList.reduce((a, e) => a + parseFloat(e.amount), 0) || trip.total_spent || 0;
    const isActive = trip.id === currentTripId;
    
    let dur = 0;
    if (trip.start_date && trip.end_date) {
      dur = Math.ceil((new Date(trip.end_date) - new Date(trip.start_date)) / 86400000);
    }
    
    const homeAmt = convert(total, trip.currency_code, user.home_currency || 'USD');

    // THE FIX: Define the fallback image and use it if cover_url is empty
    const fallbackImg = 'https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=600&q=80';
    const displayImage = trip.cover_url ? trip.cover_url : fallbackImg;

    return `<div class="trip-card ${isActive ? 'active' : ''}">
      <img src="${displayImage}" class="cover-img" onerror="this.onerror=null; this.src='${fallbackImg}';">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
        <div>
          <div style="font-size:16px;font-weight:700;margin-bottom:6px;">${trip.name}</div>
          <span class="badge ${trip.status}">${statusLabel(trip.status)}</span>
          <div style="margin-top:8px;">
            ${dur ? `<div style="font-size:12px;color:var(--muted);">📅 ${trip.start_date} → ${trip.end_date} &nbsp;·&nbsp; ${dur} days</div>` : ''}
            <div style="font-size:12px;color:var(--muted);margin-top:3px;">${trip.currency_code} &nbsp;·&nbsp; ${expenseList.length} expenses</div>
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-family:'DM Mono',monospace;font-size:22px;font-weight:600;color:var(--accent);">${trip.currency_code} ${total.toFixed(2)}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">≈ ${user.home_currency || 'USD'} ${homeAmt.toFixed(2)}</div>
          <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end;">
            <button class="sm" onclick="selectTrip(${trip.id})">Open →</button>
            <button class="danger sm" onclick="deleteTrip(${trip.id}, '${trip.name.replace(/'/g, "\\'")}')">Delete</button>
          </div>
        </div>
      </div>
      ${budgetBarHtml(trip.currency_code, total, trip.budget)}
    </div>`;
  }).join('');
}

function onCurrencyChange() { renderTrips(); }

init();
</script>
</body>
</html>
